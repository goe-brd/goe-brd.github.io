<div style="width:100%; float:left;">	
<div style="width:49%; float:left;">
<center>
<h2>Request Call Back</h2>
  <p>⚡ Limited Seats Available – We will contact you soon.</p>
</center>
  <form id="callbackForm" style="background: white; border-radius: 12px; box-shadow: rgba(0, 0, 0, 0.1) 0px 5px 20px; margin: auto; max-width: 500px; padding: 25px;">

    Name: <input name="name" required="" style="border-radius: 6px; border: 1px solid rgb(204, 204, 204); margin: 10px 0px; padding: 12px; width: 100%;" type="text" />
    
    Contact Number: <input name="phone" required="" style="border-radius: 6px; border: 1px solid rgb(204, 204, 204); margin: 10px 0px; padding: 12px; width: 100%;" type="tel" />
    
    Email: <input name="email" placeholder="Email (Optional)" style="border-radius: 6px; border: 1px solid rgb(204, 204, 204); margin: 10px 0px; padding: 12px; width: 100%;" type="email" />
    
    <select name="country" style="border-radius: 6px; border: 1px solid rgb(204, 204, 204); margin: 10px 0px; padding: 12px; width: 100%;">
      <option value="">Preferred Country</option>
      <option>Russia</option>
      <option>Georgia</option>
      <option>Uzbekistan</option>
      <option>Other Country</option>
    </select>

    <button style="background: #007BFF; border-color: currentcolor; border-image: initial; border-radius: 6px; border-style: none; border-width: medium; border: none; color: white; font-size: 16px; padding: 14px; width: 100%;" type="submit">
      Request Call Back
    </button>

    <p id="msg" style="font-weight: bold; margin-top: 15px;"></p>

  </form>
</section>

<script>
document.getElementById("callbackForm").addEventListener("submit", function(e){
  e.preventDefault();

  let msg = document.getElementById("msg");

  var name = this.name.value;
  var phone = this.phone.value;
  var country = this.country.value;

  // Save to Google Sheet
  fetch("https://script.google.com/macros/s/AKfycbzWlWHG0burSe8sTinPgm9pSx4UBKxnFZ1NBp8D7PS_Pl84niDi0ncD6NI1yFuhM7xX/exec", {
    method: "POST",
    body: JSON.stringify({
      name: name,
      phone: phone,
      email: this.email.value,
      country: country
    })
  });

  
  msg.innerHTML = `
    ✅ Message Sent!;

  document.getElementById("callbackForm").reset();
});
</script>
