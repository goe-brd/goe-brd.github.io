<style>
.contact-wrapper {
  display: flex;
  gap: 25px;
}

.card {
  background: white;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  padding: 25px;
}

.contact-form {
  flex: 1;
}

.contact-map {
  flex: 1;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 14px;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  background: #0066cc;
  color: white;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #07406d;
}

iframe {
  width: 100%;
  height: 100%;
  min-height: 420px;
  border-radius: 15px;
  border: 0;
}

.contact-info {
  margin-top: 20px;

  color: #555;
}

@media (max-width: 768px) {
  .contact-wrapper {
    flex-direction: column;
  }

  iframe {
    min-height: 300px;
  }

  .header h1 {

<body>

<div id="banner" style="display: flex; align-items: center; ">

    </nav>
    <main>

<div class="contact-wrapper">

    <div class="contact-form card">
      <h2>Request Call Back</h2>
      <form id="callbackForm" style="background: white; border-radius: 12px; box-shadow: rgba(0, 0, 0, 0.1) 0px 5px 20px; margin: auto; max-width: 500px; padding: 25px;">

    Name: <input name="name" required="" style="border-radius: 6px; border: 1px solid rgb(204, 204, 204); margin: 10px 0px; padding: 12px; width: 100%;" type="text" />
    
    Contact Number: <input name="phone" required="" style="border-radius: 6px; border: 1px solid rgb(204, 204, 204); margin: 10px 0px; padding: 12px; width: 100%;" type="tel" />
    
    Email: <input name="email" placeholder="Email (Optional)" style="border-radius: 6px; border: 1px solid rgb(204, 204, 204); margin: 10px 0px; padding: 12px; width: 100%;" type="email" />
    
    <select name="country" style="border-radius: 6px; border: 1px solid rgb(204, 204, 204); margin: 10px 0px; padding: 12px; width: 100%;">
      <option value="">Preferred Country</option>
      <option>Russia</option>
      <option>Georgia</option>
      <option>Uzbekistan</option>
      <option>Other Country</option>
    </select>

    <button type="submit">
      Send
    </button>

    <p id="msg" style="font-weight: bold; margin-top: 15px;"></p>

  </form>
    </div>

    <div class="contact-map">
      <iframe src="https://maps.google.com/maps?q=vadodara&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
    </div>

  </div>
<div style="clear:both;" />
	    
</main>
    <footer>
      10 Astron Avenue, Bhayli, Vadodara - 391410<br/>
      Phone: 9909219258 | Email: gujaratoverseas653@gmail.com
    </footer>
  </div>
  
  <script>
document.getElementById("callbackForm").addEventListener("submit", function(e){
  e.preventDefault();

  let msg = document.getElementById("msg");

  var form = this;

  var formData = new FormData(form);

  fetch("https://script.google.com/macros/s/AKfycbx1E8pgKzCRbzpx5s86_5gq7xltUOGVkeIuq7IUIlcRL08tuK89szMzVB9uoYwjS02n/exec", {
    method: "POST",
    body: formData
  })
  .then(response => response.text())
  .then(data => {
    msg.innerHTML = "✅ Message Sent Successfully!";
    msg.style.color = "green";
    form.reset();
  })
  .catch(error => {
    msg.innerHTML = "❌ Error! Try again.";
    msg.style.color = "red";
  });

});
</script>
